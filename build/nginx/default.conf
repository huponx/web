# One server block for every web app image (SPA served by nginx-unprivileged on 8080).
# /tmp/headers.conf is written at start by 40-headers.sh (the CSP depends on API_BASE of /config.js).
# add_header of a location replaces the ones of the server level, so each location includes the file.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # runtime configuration rendered by the chart (ConfigMap mounted over this file)
    location = /config.js {
        include /tmp/headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Vite names the files after their content: cache for ever
    location /assets/ {
        include /tmp/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA fallback: any other path is a route of the app
    location / {
        include /tmp/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
